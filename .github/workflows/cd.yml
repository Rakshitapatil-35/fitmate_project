name: FITMATE CD

on:
  workflow_run:
    workflows:
      - FITMATE CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Publish Versioned Images to GHCR
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set image tag metadata
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./FIT/backend
          file: ./FIT/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fitmate-backend:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ github.repository_owner }}/fitmate-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./FIT/frontend
          file: ./FIT/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fitmate-frontend:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ github.repository_owner }}/fitmate-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Protected Production Environment
    runs-on: ubuntu-latest
    needs: publish-images
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}

    steps:
      - name: Check deployment target configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Deployment target secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY) are not configured yet."
            echo "Images have been published to GHCR with tag ${{ needs.publish-images.outputs.image_tag }}."
            echo "See DEPLOYMENT_GUIDE.md to configure your production host and GitHub Environment secrets."
            exit 0
          fi
          echo "Deployment target configured for host (value masked). Proceeding with SSH deploy..."

      # Example SSH + Docker Compose deployment step (activates once DEPLOY_* secrets are set):
      - name: Deploy via SSH and run post-deploy health check
        if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/fitmate' }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.image_tag }}
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_PATH} && docker compose pull && docker compose up -d && docker compose ps"
          if [ -n "$PRODUCTION_APP_URL" ]; then
            curl -fsS "${PRODUCTION_APP_URL}/api/v1/health"
          fi
