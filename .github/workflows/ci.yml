name: FITMATE CI

on:
  push:
    branches:
      - main
      - rakshita
      - "integration/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - rakshita
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-ml:
    name: Backend & 5-Model ML Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "FIT/backend/requirements.txt"

      - name: Install backend & ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r FIT/backend/requirements.txt

      - name: Verify all 5 ML model artifacts exist
        run: |
          python - <<'EOF'
          from pathlib import Path
          required = [
              "FIT/backend/models/model_1_size.joblib",
              "FIT/backend/models/model_2_fit.joblib",
              "FIT/backend/models/model_3_garment.joblib",
              "FIT/backend/models/model_4_cluster_female.joblib",
              "FIT/backend/models/model_4_cluster_male.joblib",
              "FIT/backend/models/model_5_feedback.joblib",
              "FIT/backend/app/ml/artifacts/size_model.joblib",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f"Missing ML model artifacts: {missing}"
          print(f"Verified all {len(required)} ML model artifacts.")
          EOF

      - name: Run full backend & ML pytest suite
        working-directory: FIT/backend
        env:
          PYTHONPATH: .
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'ci-test-only-jwt-secret-key-min-32-bytes-long' }}
        run: |
          python -m pytest app/tests tests -v --tb=short

  frontend-build-and-check:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend bundle and validate syntax
        run: |
          python FIT/frontend/build.py
          node --check FIT/frontend/bundle.js

      - name: Verify all mapped image assets exist on disk
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          base = Path("FIT/frontend")
          text = (base / "config/images.js").read_text(encoding="utf-8")
          paths = sorted(set(re.findall(r"'\./([^']+)'", text)))
          missing = [p for p in paths if not (base / p).is_file()]
          assert not missing, f"Missing frontend assets: {missing}"
          print(f"Verified {len(paths)} unique mapped assets in config/images.js.")
          EOF

  docker-and-compose-verify:
    name: Docker Build & Compose Smoke Verification
    runs-on: ubuntu-latest
    needs:
      - backend-and-ml
      - frontend-build-and-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build backend & frontend Docker images
        run: docker compose build

      - name: Start stack and verify container healthchecks
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            b=$(docker inspect -f '{{.State.Health.Status}}' fitmate-backend 2>/dev/null || echo "starting")
            f=$(docker inspect -f '{{.State.Health.Status}}' fitmate-frontend 2>/dev/null || echo "starting")
            echo "Attempt $i: backend=$b frontend=$f"
            if [ "$b" = "healthy" ] && [ "$f" = "healthy" ]; then
              break
            fi
            sleep 3
          done
          docker compose ps
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:5173/nginx-health
          curl -fsS http://127.0.0.1:5173/api/v1/health

      - name: Tear down test containers (keep clean runner)
        if: always()
        run: docker compose down -v
