<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FITMATE • Intelligent Couture & Luxury Sizing Platform</title>
  <link rel="icon" type="image/png" href="./assets/brand/favicon.png" />

  <!-- Config script for backend URL override if needed -->
  <script>
    window.FITMATE_CONFIG = {
      apiUrl: (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname)
        ? 'http://localhost:8000/api/v1'
        : '/api/v1'
    };
